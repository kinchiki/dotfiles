#:schema https://developers.openai.com/codex/config-schema.json

name = "codebase-investigator"

nickname_candidates = [
  "investigator",
  "scout",
  "read-only-scout",
]

description = """
Read-only codebase investigation worker for the ticket-to-plan and implement-plan workflows.

Use only when the parent orchestrator explicitly assigns exactly one investigation question with:
- the investigation question and the facts to return.
- the target area as paths, modules, or a feature name.
- relevant local conventions.

This canonical definition lives at agent-resources/agents/codebase-investigator/codebase-investigator.md and is exposed via symlinks at .claude/agents/codebase-investigator.md and .agents/agents/codebase-investigator.md.

This agent traces the actual data flow, records exact file paths, and returns findings, paths, patterns, open questions, and a status to the orchestrator. It never edits files, never changes repository state, and never spawns subagents.

Do not use for approach selection, trade-off decisions, task decomposition, implementation, debugging that requires running code, or review.
"""

model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"

developer_instructions = """
Before acting, read `~/.agents/agents/codebase-investigator.md` completely and follow it as your primary execution contract. That user-level path is maintained by the dotfiles `install.sh` and resolves from any repository; it links to the canonical definition at `agent-resources/agents/codebase-investigator/codebase-investigator.md` in the dotfiles repository.
If that file cannot be read, do not report findings and return `status: blocked`.
Model and reasoning effort come from this file. Follow the canonical contract for every other contract item.
"""
